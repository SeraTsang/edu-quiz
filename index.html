<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>辨析题库 · 易错自测</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --brand:#6c5ce7; --brand2:#a29bfe; --bg:#f5f6fa; --card:#fff;
  --ok:#00b894; --ok-bg:#e6faf3; --bad:#e17055; --bad-bg:#fdeee9;
  --txt:#2d3436; --sub:#747c8d; --line:#e8eaf0; --radius:14px;
  --safe:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;overflow:hidden}
button{font-family:inherit}
.hidden{display:none!important}

/* ============ 顶栏 ============ */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.icon-btn{width:38px;height:38px;flex:0 0 38px;border:none;border-radius:10px;background:#f0f1f6;color:var(--txt);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;transition:.15s}
.icon-btn:active{transform:scale(.92)}
.icon-btn .dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.chip{flex:1;min-width:0;height:38px;display:flex;align-items:center;gap:6px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-size:14px;font-weight:600}
.chip .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.chip .cnt{font-size:11px;color:var(--sub);font-weight:500;flex:0 0 auto}
.chip .arw{color:var(--sub);font-size:11px;flex:0 0 auto}
.wrap{max-width:560px;margin:0 auto;width:100%;height:100%;display:flex;flex-direction:column}
.topbar>*{flex:0 0 auto}
.topbar .chip{flex:1 1 auto}
.main{height:auto;flex:1 1 auto}
@media(min-width:820px){.wrap{max-width:860px}.stat-row,.mode-list{grid-template-columns:repeat(2,1fr)}}
.mini-prog{position:absolute;left:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .3s;border-radius:0 2px 2px 0}

/* ============ 主体 ============ */
.main{height:calc(100vh - 55px);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:12px 12px calc(24px + var(--safe))}
.view{animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ============ 起始页 ============ */
.hero{padding:8px 2px 14px}
.hero h1{font-size:22px;letter-spacing:.5px}
.hero p{color:var(--sub);font-size:13px;margin-top:2px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border-radius:12px;padding:10px 8px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat b{display:block;font-size:19px;color:var(--brand)}
.stat span{font-size:11px;color:var(--sub)}
.sec-title{font-size:12px;color:var(--sub);margin:14px 2px 8px;letter-spacing:1px}
.mode-list{display:flex;flex-direction:column;gap:10px}
.mode-card{display:flex;width:100%;text-align:left;font:inherit;align-items:center;gap:12px;background:var(--card);border-radius:var(--radius);padding:14px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.05);border:1px solid transparent;transition:.15s}
.mode-card:active{transform:scale(.985)}
.mode-card:focus-visible,.small-add:focus-visible,.fav-btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mode-card.picked{border-color:var(--brand);background:#f6f5ff}
.mode-ic{width:42px;height:42px;flex:0 0 42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
.mode-tx{flex:1;min-width:0}
.mode-tx b{font-size:15px;display:block}
.mode-tx span{font-size:12px;color:var(--sub)}
.mode-go{color:var(--sub);font-size:13px;flex:0 0 auto}
.ch-mini{display:flex;gap:8px;overflow-x:auto;padding:2px;margin:0 -2px;scrollbar-width:none}
.ch-mini::-webkit-scrollbar{display:none}
.ch-mini div{flex:0 0 auto;padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13px;cursor:pointer;white-space:nowrap}
.ch-mini div.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.ch-mini button{flex:0 0 auto;border:1px solid var(--line);padding:8px 14px;border-radius:20px;background:#eef0f4;color:#626976;font-size:13px;cursor:pointer}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 8px}
.section-head .sec-title{margin:0}
.small-add{display:inline-flex;align-items:center;justify-content:center;gap:5px;flex:0 0 auto;background:#eef0f4;border:1px solid #e1e4eb;border-radius:9px;color:#5b6472;font-size:13px;font-weight:600;padding:7px 10px;cursor:pointer}
.small-add:active{background:#e2e6ed}
.entry-ch-row{display:flex;align-items:center;gap:8px}
.entry-ch-row select{flex:1;min-width:0}
.entry-ch-row .small-add{height:42px}
.chapter-add-row{width:100%;margin-top:10px;padding:11px;border:1px dashed #cbd0d9;border-radius:10px;background:#f1f2f5;color:#5c6472;font-size:14px;font-weight:600;cursor:pointer}
.chapter-overlay{position:fixed;inset:0;background:rgba(20,20,35,.55);z-index:75;display:flex;align-items:center;justify-content:center;padding:20px}
.chapter-dialog{width:min(100%,420px);background:#fff;border-radius:16px;box-shadow:0 18px 60px rgba(0,0,0,.2);padding:20px}
.chapter-dialog h2{font-size:18px;margin-bottom:6px}
.chapter-dialog p{font-size:12px;color:var(--sub);margin-bottom:14px}
.chapter-actions{display:flex;gap:10px;margin-top:18px}
.chapter-actions button{flex:1;height:42px;border:0;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.chapter-actions .cancel{background:#f0f1f6;color:var(--txt)}
.chapter-actions .save{background:var(--brand);color:#fff}
.start-bar{position:sticky;bottom:0;padding:10px 0 calc(10px + var(--safe));background:linear-gradient(to top,var(--bg) 65%,rgba(245,246,250,0))}
.btn-primary{width:100%;height:48px;border:none;border-radius:14px;background:var(--brand);color:#fff;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(108,92,231,.35)}
.btn-primary:disabled{opacity:.45;box-shadow:none}
.btn-ghost{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--txt);font-size:14px;cursor:pointer;margin-top:8px}

/* ============ 做题页 ============ */
.q-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);padding:2px 2px 8px}
.tag{padding:2px 8px;border-radius:20px;background:#eeedfb;color:var(--brand);font-size:11px;font-weight:600}
.tag.gray{background:#f0f1f6;color:var(--sub)}
.tag.orange{background:#fff3e6;color:#e67e22}
.q-card{background:var(--card);border-radius:var(--radius);padding:18px 16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.q-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:16px;min-height:44vh;min-height:44dvh;}
.q-stem{flex:1;min-width:0;font-size:17px;font-weight:600;line-height:1.65}
.fav-btn{flex:0 0 38px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;background:#fff;color:#b5bac6;font-size:23px;line-height:1;cursor:pointer}
.fav-btn.on{color:#d89a13;background:#fff8df;border-color:#f5dc9b}
.fav-btn:active{transform:scale(.94)}
.judge{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:14px;}
.judge button{width:100%;min-height:54px;}
.judge button{height:52px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px}
.judge button:active{transform:scale(.97)}
.judge button.T.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.judge button.F.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.judge button.F.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.judge button[disabled]{cursor:default}
.verdict{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:8px}
.verdict.right{color:var(--ok)}
.verdict.wrong{color:var(--bad)}
.ana{background:#f8f8fc;border-left:3px solid var(--brand);border-radius:0 10px 10px 0;padding:12px 12px 30px;font-size:14px;color:#4a4f5e;position:relative}
.ana p{margin-bottom:8px}
.ana p:last-child{margin-bottom:0}
.ana .key{display:inline-block;background:#eeedfb;color:var(--brand);font-weight:600;padding:1px 6px;border-radius:4px;font-size:13px;margin:1px 0}
.ana-edit{position:absolute;right:8px;bottom:8px;border:none;background:#eceef4;color:#7a8093;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;opacity:.55}
.ana-edit:active{opacity:1}
/* 底部操作条：始终可见，不下拉 */

/* 做题页：固定底部导航栏 */
.dock{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 24px);
  max-width:536px;
  z-index:35;

  display:flex;
  align-items:center;
  gap:8px;

  padding:10px 0 calc(10px + var(--safe));
  margin-top:0;
  background:var(--bg);
  border-top:1px solid var(--line);
}

/* 桌面端适配 */
@media(min-width:820px){
  .dock{
    max-width:836px;
  }
}

/* 为固定导航栏预留空间，防止遮挡解析 */
#runView{
  padding-bottom:calc(90px + var(--safe));
}

.dock .icon-btn{background:#fff;border:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.05)}
.dock .nav{flex:1;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px;cursor:pointer}
.dock .nav:disabled{opacity:.4}
.dock .cnt{font-size:12px;color:var(--sub);text-align:center;flex:0 0 auto;min-width:44px}

/* ============ 弹层 ============ */
.mask{position:fixed;inset:0;background:rgba(20,20,35,.45);z-index:50;opacity:0;pointer-events:none;transition:.2s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{pointer-events:none;visibility:hidden;position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-radius:18px 18px 0 0;max-height:72vh;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .25s cubic-bezier(.32,.72,0,1);padding-bottom:var(--safe)}
.sheet.on{pointer-events:auto;visibility:visible;transform:translateY(0)}
@media(min-width:640px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:460px;max-height:80vh;border-radius:16px;transform:translate(-50%,-46%) scale(.97);opacity:0;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1}
}
.sheet-h{display:flex;align-items:center;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-h b{flex:1;font-size:16px}
.sheet-h button{border:none;background:#f0f1f6;color:var(--sub);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px}
.sheet-b{overflow-y:auto;padding:12px 16px 18px;-webkit-overflow-scrolling:touch}
.sheet-f{padding:10px 16px calc(12px + var(--safe));border-top:1px solid var(--line);display:flex;gap:8px}
.sheet-f button{flex:1;height:42px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer}
.sheet-f .pri{background:var(--brand);color:#fff}
.sheet-f .sec{background:#f0f1f6;color:var(--txt)}

.row-item{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.row-item:active{background:#f6f6fa}
.row-item.on{background:#f6f5ff;border-color:#e0ddfb}
.row-item .ic{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#f0f1f6;font-size:16px}
.row-item .tx{flex:1;min-width:0}
.row-item .tx b{display:block;font-size:14px;font-weight:600}
.row-item .tx span{font-size:11px;color:var(--sub)}
.row-item .del{border:none;background:transparent;color:#c7cbd6;font-size:16px;padding:4px 6px;cursor:pointer}
.row-item .del:active{color:var(--bad)}
.add-line{display:flex;gap:8px;margin-top:10px}
.add-line input{flex:1;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:14px;outline:none}
.add-line input:focus{border-color:var(--brand)}
.add-line button{height:40px;padding:0 14px;border:none;border-radius:10px;background:#eeedfb;color:var(--brand);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}

label.fl{display:block;font-size:12px;color:var(--sub);margin:10px 0 5px}
.fld{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;font-family:inherit;outline:none;background:#fbfbfd}
.fld:focus{border-color:var(--brand);background:#fff}
textarea.fld{min-height:110px;resize:vertical;line-height:1.6}
.hint{font-size:12px;color:var(--sub);background:#f7f7fb;border-radius:8px;padding:8px 10px;line-height:1.6}
.hint code{background:#eceafb;color:var(--brand);padding:1px 4px;border-radius:4px;font-size:11px}
.prev{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:#fbfbfd}
.prev .pt{font-size:13px;font-weight:600;margin-bottom:8px}
.prev .pa{display:flex;gap:6px;margin-bottom:8px}
.prev .pa button{flex:1;height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:13px}
.prev .pa button.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.prev textarea{min-height:80px;font-size:13px}
.imp-item{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.imp-item .badge{font-size:10px;background:#eeedfb;color:var(--brand);padding:2px 6px;border-radius:4px;font-weight:600}
.imp-item .err{color:var(--bad);font-size:12px}

.grid-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px}
.grid-pick button{aspect-ratio:1;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:13px;cursor:pointer;color:var(--txt)}
.grid-pick button.r{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.grid-pick button.w{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.grid-pick button.cur{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.legend{display:flex;gap:12px;font-size:11px;color:var(--sub);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}

.line-item{display:flex;align-items:center;gap:10px;padding:12px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.line-item:last-child{border-bottom:none}
.line-item .tx{flex:1;min-width:0}
.line-item .tx b{font-size:14px;display:block}
.line-item .tx span{font-size:11px;color:var(--sub)}
.line-item .arw{color:#c7cbd6}
.usr{display:flex;align-items:center;gap:10px;padding:4px 0 12px}
.usr .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.usr .tx{flex:1;overflow:hidden}
.usr .tx b{font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis}
.usr .tx span{font-size:11px;color:var(--sub)}
.usr button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--bad)}

.done{text-align:center;padding:26px 10px}
.done .big{font-size:44px;font-weight:800;color:var(--brand);line-height:1}
.done .big small{font-size:16px;color:var(--sub);font-weight:500}
.done p{color:var(--sub);font-size:13px;margin-top:6px}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:30px 10px}

/* ============ 登录 ============ */
.login{position:fixed;inset:0;z-index:80;background:linear-gradient(160deg,#6c5ce7,#a29bfe 60%,#dfe6ff);display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{width:100%;max-width:360px;background:#fff;border-radius:20px;padding:26px 22px;box-shadow:0 18px 50px rgba(40,30,90,.3)}
.login-box h2{font-size:19px;margin-bottom:2px}
.login-box .sub{font-size:12px;color:var(--sub);margin-bottom:18px;min-height:18px}
.login-box input{width:100%;height:44px;border:1px solid var(--line);border-radius:11px;padding:0 12px;font-size:15px;outline:none;margin-bottom:10px;background:#fbfbfd}
.login-box input:focus{border-color:var(--brand);background:#fff}
.login-box .go{width:100%;height:44px;border:none;border-radius:11px;background:var(--brand);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.login-box .sw{width:100%;height:38px;border:none;background:transparent;color:var(--brand);font-size:13px;cursor:pointer;margin-top:2px}
.login-box .tip{font-size:11px;color:#b2b6c4;margin:0 0 12px;line-height:1.5;padding-left:2px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(84px + var(--safe));transform:translateX(-50%) translateY(10px);z-index:99;background:rgba(30,30,45,.92);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
<!-- 顶栏：极简，只放入口 + 当前章节 -->
<header class="topbar">
  <button class="icon-btn" onclick="goHome()" title="首页">🏠</button>
  <button class="chip" onclick="openSheet('ch')">
    <span class="nm" id="curChName">选择章节</span>
    <span class="cnt" id="curChCnt"></span>
    <span class="arw">▼</span>
  </button>
  <button class="small-add" onclick="openChapterModal()" title="添加章节" aria-label="添加章节">＋</button>
  <button class="icon-btn" onclick="openSheet('more')" title="更多">☰</button>
  <div class="mini-prog" id="miniProg" style="width:0"></div>
</header>

<main class="main" id="main">

  <!-- ===== 起始页 ===== -->
  <section class="view" id="homeView">
    <div class="hero">
      <h1 id="heroHi">开始今天的辨析 👋</h1>
      <p id="heroSub">选个章节和模式，一屏一题，专注做题</p>
    </div>
    <div class="stat-row">
      <div class="stat"><b id="stTotal">0</b><span>本题库题目</span></div>
      <div class="stat"><b id="stDone">0</b><span>已作答</span></div>
      <div class="stat"><b id="stRate">—</b><span>正确率</span></div>
    </div>

    <div class="section-head"><div class="sec-title">选择章节</div><button class="small-add" onclick="openChapterModal()">＋ 添加章节</button></div>
    <div class="ch-mini" id="chMini"></div>

    <div class="sec-title">练习模式</div>
    <div class="mode-list">
      <button type="button" class="mode-card" id="md-chapter" onclick="pickMode('chapter')">
        <div class="mode-ic" style="background:linear-gradient(135deg,#6c5ce7,#a29bfe)">📖</div>
        <div class="mode-tx"><b>章节模式</b><span>从上次进度继续，逐题推进</span></div>
        <div class="mode-go" id="go-chapter">›</div>
      </button>
      <button type="button" class="mode-card" id="md-seq" onclick="pickMode('seq')">
        <div class="mode-ic" style="background:linear-gradient(135deg,#00b894,#55efc4)">➡️</div>
        <div class="mode-tx"><b>顺序模式</b><span>从头到尾重刷一遍</span></div>
        <div class="mode-go" id="go-seq">›</div>
      </button>
      <button type="button" class="mode-card" id="md-rand" onclick="pickMode('rand')">
        <div class="mode-ic" style="background:linear-gradient(135deg,#0984e3,#74b9ff)">🔀</div>
        <div class="mode-tx"><b>乱序模式</b><span>打乱顺序，检验真实掌握</span></div>
        <div class="mode-go" id="go-rand">›</div>
      </button>
      <button type="button" class="mode-card" id="md-wrong" onclick="pickMode('wrong')">

const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1800)}
const orderedCh=()=>S.order.map(id=>S.chapters.find(c=>c.id===id)).filter(Boolean);

const pct=x=>Math.round(x*100);
function fmtAna(t){
  // The built-in bank already contains <span class="key">…</span>; escape all other HTML.
  // Protect only explicitly whitelisted highlights before encoding text, preventing XSS.
  const highlights=[];
  const marked=String(t??'').replace(/<span\s+class\s*=\s*(["'])key\1\s*>([\s\S]*?)<\/span>/gi,(_,quote,inner)=>{
    const i=highlights.push(inner)-1;
    return '\uE000'+i+'\uE001';
  });
  return esc(marked).replace(/\*\*([\s\S]+?)\*\*/g,(_,inner)=>'<span class="key">'+inner+'</span>')
    .replace(/\uE000(\d+)\uE001/g,(_,i)=>'<span class="key">'+esc(highlights[Number(i)]||'')+'</span>')
    .replace(/\n/g,'<br>');
}

function renderRun(){

  $('prevBtn').disabled=run.idx===0;

  const fav=!!S.favorites[q.id];

  $('qCard').innerHTML=`
    <div class="q-head">
      <div class="q-stem">${esc(q.s)}</div>

    </div>
    ${done?`<div class="verdict ${ok?'right':'wrong'}">${ok?'✓ 答对了':'✗ 答错了'} · 正确答案：${q.a?'正确':'错误'}</div>

}
function toggleFavorite(){

function pick(v){

  if(run.mode==='chapter'){
    const c=chById(run.chId),i=c.qs.findIndex(x=>x.id===q.id);

function delCh(id){

/* ==== 录入 ==== */
let parsed=[];
function entryBody(){
  parsed=[];
  return `<label class="fl">归入章节</label>
  <div class="entry-ch-row"><select class="fld" id="entCh">${orderedCh().map(c=>`<option value="${c.id}" ${c.id===selCh?'selected':''}>${esc(c.icon)} ${esc(c.name)}（${c.qs.length}题）</option>`).join('')}</select><button class="small-add" onclick="openChapterModal()" title="新增章节">＋ 新增</button></div>
  <label class="fl">粘贴解析（支持一次多条，空行分隔）</label>
  <textarea class="fld" id="entRaw" placeholder="【题干】老师担心讲授的知识学生无法掌握，这体现了什么矛盾？
【解析】本题考查教育的基本要素。教育最基本的矛盾是受教育者与教育内容的矛盾。故正确答案为C。"></textarea>
  <div class="hint" style="margin-top:8px">
    推荐格式：<code>【题干】…</code> + <code>【解析】…</code>，一条题一个空行。<br>
    只粘解析也行，系统会自动去掉"本题考查/题干中/故正确答案为X"等套话，题干留空你自己补。
  </div>
  <div id="entPrev"></div>`;
}
function parseEntry(){
  const chId=$('entCh').value,raw=$('entRaw').value.trim();
  if(!raw)return toast('先粘贴内容');
  parsed=raw.split(/\n[ \t]*\n/).map(cleanQ).filter(o=>o.s||o.x);
  if(!parsed.length)return toast('没识别到内容，检查格式');
  $('entPrev').innerHTML='<div class="hint" style="margin-top:10px">识别到 '+parsed.length+' 条，核对后入库（答案默认按"故正确/错误"推断，务必确认）：</div>'+parsed.map((o,i)=>`
    <div class="prev">
      <div class="pt">第 ${i+1} 条 <span class="badge">${esc(o.g||'未识别考点')}</span></div>
      <input class="fld" placeholder="题干（必填）" value="${esc(o.s)}" oninput="parsed[${i}].s=this.value">
      <div class="pa"><button class="${o.a?'on':''}" onclick="setAns(${i},true,this)">✓ 正确</button><button class="${!o.a?'on':''}" onclick="setAns(${i},false,this)">✗ 错误</button></div>
      <textarea class="fld" placeholder="解析" oninput="parsed[${i}].x=this.value">${esc(o.x)}</textarea>
      <input class="fld" style="margin-top:6px" placeholder="记忆点（可选）" value="${esc(o.k)}" oninput="parsed[${i}].k=this.value">
    </div>`).join('');
  $('sheetOk').textContent='确认入库 '+parsed.length+' 条';
  sheetOkFn=confirmEntry;
}
function setAns(i,v,btn){parsed[i].a=v;btn.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));btn.classList.add('on')}
function cleanQ(blk){
  let s='',rest=blk;
  const sm=blk.match(/【题干】\s*([\s\S]*?)(?=\n\s*【解析】|$)/);
  if(sm){s=sm[1].trim();rest=(blk.match(/【解析】\s*([\s\S]*)/)||[,''])[1]}
  let x=rest.replace(/^\s*【解析】\s*/,'').trim();
  const am=x.match(/故正确答案为\s*([A-D])[。．.]?\s*$/);
  const g=(x.match(/本题考查([^。，,、\s]{2,12})/)||[,''])[1];
  x=x.split('\n').map(l=>l.replace(/^\s*(本题考查|题干中|题干|因此|所以)[^。]{0,40}。\s*/,'').replace(/故正确答案为\s*[A-D][。．.]?\s*$/,'').replace(/[ \t]+/g,' ').trim()).filter(Boolean).join('\n');
  x=x.replace(/[\uFFFD\u25A1]+/g,'').trim();
  let a=true;
  if(am)a=/[AC]/i.test(am[1]);
  else if(/正确|对\s*$|√/.test(x.slice(-12)))a=true;
  else if(/错误|错\s*$|×|✗/.test(x.slice(-12)))a=false;
  return{s,a,x,k:'',g};
}
function confirmEntry(){
  const chId=$('entCh').value,c=chById(chId);
  const ok=parsed.filter(o=>o.s.trim()&&o.x.trim());
  if(!ok.length)return toast('每条都要有题干和解析');
  ok.forEach(o=>c.qs.push({id:'u_'+uid(),s:o.s.trim(),a:o.a,x:o.x.trim(),k:o.k.trim()}));
  if(!S.order.includes(chId))S.order.push(chId);
  selCh=chId;
  if(c.builtin)pushCloud();else pushChapters();
  closeSheet();refreshChrome();renderHome();if(run)renderRun();
  toast('已入库 '+ok.length+' 题到「'+c.name+'」');
}

/* ==== 章节导入（JSON） ==== */
function impBody(d){
  if(d&&d.chapters){
    window._impIdMap={};
    window._imp=d.chapters.filter(c=>c&&c.name&&Array.isArray(c.qs)).map(c=>({
      ...c,icon:c.icon||'📘',
      qs:c.qs.filter(q=>q.s&&q.x!==undefined).map(q=>{
        const newId='i_'+uid();
        if(window._restoreProgress&&q.id)window._impIdMap[q.id]=newId;
        return{id:newId,s:String(q.s),a:!!q.a,x:String(q.x||''),k:String(q.k||'')};
      })
    }));
    if(!window._imp.length)return '<div class="empty">文件里没找到可用章节（需要 {name, qs:[{s,a,x}]} 结构）</div>';
    return '<div class="hint" style="margin-bottom:10px">文件中识别到 '+window._imp.length+' 个章节，入库后会成为你账号下的自定义章节：</div>'+window._imp.map((c,i)=>`
      <div class="imp-item"><span class="badge">章节 ${i+1}</span> <b>${esc(c.name)}</b> ${esc(c.icon)}
      <div style="font-size:12px;color:var(--sub)">${c.qs.length} 题 · 示例：${esc(c.qs[0]?c.qs[0].s.slice(0,26)+'…':'—')}</div></div>`).join('');
  }
  return `<div class="hint">可导入他人分享的章节包（JSON），结构与导出文件一致：<br><code>{"chapters":[{"name":"教育心理学 · 第二章","icon":"🧠","qs":[{"s":"题干","a":true,"x":"解析","k":"记忆点"}]}]}</code><br>导入的章节可以像普通章节一样做题、删除。</div>
  <label class="fl">选择 JSON 文件</label><input type="file" accept=".json" class="fld" onchange="pickImp(event)">
  <div id="impPickResult"></div>`;
}
function pickImp(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{try{openSheet('imp',JSON.parse(ev.target.result))}catch(err){$('impPickResult').innerHTML='<div class="imp-item err">文件不是合法 JSON</div>'}};
  r.readAsText(f);
}
function confirmImp(){
  const list=window._imp||[];
  if(!list.length)return toast('没有可导入的章节');
  const chMap={};
  list.forEach(c=>{
    const id='u_'+uid();
    if(c.id)chMap[c.id]=id;
    S.chapters.push({id,name:c.name,icon:c.icon,qs:c.qs});
    S.order.push(id);
  });
  if(window._restoreProgress){
    // Imported questions get new IDs; transfer their saved answers and favorites to them.
    Object.entries(window._impIdMap||{}).forEach(([oldId,newId])=>{
      ['answers','wrong','favorites','edits'].forEach(k=>{
        if(Object.hasOwn(S[k],oldId))S[k][newId]=S[k][oldId];
      });
    });
    Object.entries(chMap).forEach(([oldId,newId])=>{
      const oldCursor=S.cursor[oldId];
      if(oldCursor)S.cursor[newId]=window._impIdMap[oldCursor]||null;
    });
  }
  selCh=S.chapters[S.chapters.length-1].id;
  pushChapters();closeSheet();refreshChrome();renderHome();
  toast('导入 '+list.length+' 个章节');
  window._imp=null;window._impIdMap=null;window._restoreProgress=false;
}

/* ==== 数据迁移 ==== */
function migBody(){
  return `<div class="line-item" onclick="expAll()"><div class="ic">📤</div><div class="tx"><b>导出全部（题库 + 进度）</b><span>自定义章节、作答、错题、收藏、改过的解析</span></div><div class="arw">↓</div></div>
  <div class="line-item" onclick="expBank()"><div class="ic">📦</div><div class="tx"><b>只导出章节包（分享用）</b><span>不含进度，可发给别人导入</span></div><div class="arw">↓</div></div>
  <div class="line-item" onclick="document.getElementById('migFile').click()"><div class="ic">📥</div><div class="tx"><b>导入章节包 / 备份</b><span>识别 chapters 字段；含 state 字段时同时恢复进度</span></div><div class="arw">↑</div></div>
  <input type="file" id="migFile" accept=".json" class="hidden" onchange="impAll(event)">
  <div class="hint" style="margin-top:10px">云端已自动同步，导出主要用于备份和分享章节。导入章节会追加，不覆盖已有题目。</div>`;
}
function dl(obj,name){
  const b=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
const stamp=()=>new Date().toISOString().slice(0,10);
function expAll(){
  dl({v:2,exported_at:new Date().toISOString(),
    chapters:S.chapters.filter(c=>!c.builtin).map(c=>({id:c.id,name:c.name,icon:c.icon,qs:c.qs})),
    state:{answers:S.answers,wrong:S.wrong,favorites:S.favorites,edits:S.edits,cursor:S.cursor,order:S.order}},
    '辨析题库_全量备份_'+stamp()+'.json');toast('已导出');
}
function expBank(){
  const c=chById(selCh);
  dl({v:2,chapters:[{name:c.name,icon:c.icon,qs:c.qs}]},c.name.replace(/\s/g,'')+'_章节包.json');toast('已导出当前章节');
}
function impAll(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      window._restoreProgress=false;
      if(d.state&&confirm('备份里含作答进度，是否一并恢复到本地？（会覆盖当前进度）')){
        window._restoreProgress=true;
        Object.assign(S.answers,d.state.answers||{});Object.assign(S.wrong,d.state.wrong||{});
        Object.assign(S.favorites,d.state.favorites||{});
        Object.assign(S.edits,d.state.edits||{});Object.assign(S.cursor,d.state.cursor||{});
        if(d.state.order&&d.state.order.length)S.order=d.state.order;
      }
      closeSheet();
      if(d.chapters&&d.chapters.length)openSheet('imp',d);
      else{pushCloud();refreshChrome();renderHome();toast('进度已恢复')}
    }catch(err){toast('文件解析失败')}
  };
  r.readAsText(f);e.target.value='';
}

/* ==== 账号 ==== */
function accBody(){
  return `<div class="usr"><div class="av">${me?(me.email||'U')[0].toUpperCase():'?'}</div>
    <div class="tx"><b>${me?esc(me.email):'未登录'}</b><span>${me?'数据存于云端，按账号隔离':'仅本机浏览器存储'}</span></div></div>
  ${me?`<button class="btn-ghost" onclick="logout()">退出登录</button>`:`<button class="btn-primary" onclick="closeSheet();showLogin()">登录 / 注册</button>`}
  <div class="hint" style="margin-top:10px">登录后，做题进度、错题本、收藏夹、你改过的解析、自建章节都会同步到云端；在另一台设备登录同一账号即可接着做。</div>`;
}
async function logout(){await sb.auth.signOut();me=null;location.reload()}

/* ==== 登录 ==== */
let authMode='login';
function showLogin(){$('loginView').classList.remove('hidden')}
function toggleAuthMode(){
  authMode=authMode==='login'?'signup':'login';
  $('lgTitle').textContent=authMode==='login'?'欢迎回来':'创建账号';
  $('lgEmail').value='';$('lgPwd').value='';
  $('lgGo').textContent=authMode==='login'?'登录':'注册';
  $('lgSw').textContent=authMode==='login'?'没有账号？去注册':'已有账号？去登录';
  lgMsg('');cdStop();
  if(authMode==='signup')$('lgPwd').setAttribute('placeholder','设置密码（至少6位）');
  else $('lgPwd').setAttribute('placeholder','密码');
}
function lgMsg(t,color){const el=$('lgTip');el.textContent=t||'';el.style.color=color||''}
let cdTimer=null;
function cdStop(){clearInterval(cdTimer);cdTimer=null;$('lgGo').disabled=false;$('lgSw').classList.remove('hidden')}
function cdStart(sec){
  let left=sec;$('lgGo').disabled=true;$('lgSw').classList.add('hidden');
  const tick=()=>{lgMsg('注册已提交，请 '+left+' 秒后重试（避免触发邮件限制）');$('lgGo').textContent=left+' 秒后可重试';if(--left<0){cdStop();$('lgGo').textContent='注册';lgMsg('还没收到？可换邮箱再试，或稍后直接登录')}};
  tick();cdTimer=setInterval(tick,1000);
}
const FRIENDLY=[
  [/rate.?limit|429|too many/i,'请求太频繁了，稍等一会儿再试'],
  [/already (registered|exists)|用户已存在|email already/i,'这个邮箱已经注册过了，直接登录吧'],
  [/invalid login credentials/i,'邮箱或密码错误'],
  [/password/i,'密码至少 6 位'],
  [/network|fetch|Failed to fetch/i,'网络连不上，检查下网络']
];
function niceErr(m){const f=FRIENDLY.find(([re])=>re.test(m||''));return f?f[1]:(m||'出错了，稍后再试')}
async function auth(){
  if($('lgGo').disabled)return;
  const e=$('lgEmail').value.trim(),p=$('lgPwd').value;
  if(!e||!p)return lgMsg('请填写邮箱和密码','#ff7675');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))return lgMsg('邮箱格式不太对','#ff7675');
  if(p.length<6)return lgMsg('密码至少 6 位','#ff7675');
  const btn=$('lgGo');btn.disabled=true;btn.textContent='请稍候…';lgMsg('');
  let r;
  try{
    if(authMode==='login')r=await sb.auth.signInWithPassword({email:e,password:p});
    else r=await sb.auth.signUp({email:e,password:p});
  }catch(err){btn.disabled=false;btn.textContent=authMode==='login'?'登录':'注册';return lgMsg(niceErr('network'),'#ff7675')}
  if(r.error){
    btn.disabled=false;btn.textContent=authMode==='login'?'登录':'注册';
    lgMsg(niceErr(r.error.message),'#ff7675');
    if(authMode==='signup'&&/rate.?limit|429|too many/i.test(r.error.message||''))cdStart(60);
    return;
  }
  if(authMode==='signup'&&r.data.user&&!r.data.session){cdStart(60);return}
  location.reload();
}
async function boot(){
  loadLocal();
  S.favorites=S.favorites||{};
  history.replaceState({...(history.state||{}),eduQuizView:'home'},'');
  if(!S.order||!S.order.length)S.order=S.chapters.map(c=>c.id);
  selCh=(me?selCh:selCh)||S.order[0];
  const {data:{user}}=await sb.auth.getUser();
  if(user){me=user;$('loginView').classList.add('hidden');await pullCloud();if(!chById(selCh))selCh=orderedCh()[0].id}
  else if(await needLogin()){showLogin();return}
  selCh=selCh||orderedCh()[0].id;
  refreshChrome();renderHome();
}
async function needLogin(){
  const {data}=await sb.from('v2_chapters').select('id').limit(1);
  return false;
}

/* ==== 手机左右滑动切题 ==== */
let swipeStart = null;

const swipeArea = document.getElementById('runView');

swipeArea.addEventListener('touchstart', e => {
  swipeStart = null;

  // 仅处理单指滑动
  if (!run || e.touches.length !== 1) return;

  // 弹窗打开时不切题
  if (document.getElementById('mask').classList.contains('on')) return;
  if (!document.getElementById('chapterOverlay').classList.contains('hidden')) return;

  // 按钮、输入框等交互区域不触发滑动
  if (e.target.closest('button,input,textarea,select,a,.dock')) return;

  const t = e.touches[0];

  swipeStart = {
    x: t.clientX,
    y: t.clientY
  };
}, {passive:true});

swipeArea.addEventListener('touchend', e => {
  if (!swipeStart || !run) return;

  const t = e.changedTouches[0];
  const dx = t.clientX - swipeStart.x;
  const dy = t.clientY - swipeStart.y;

  swipeStart = null;

  // 水平移动超过70px，且主要为水平滑动
  if (Math.abs(dx) < 70) return;
  if (Math.abs(dx) < Math.abs(dy) * 1.5) return;

  if (dx < 0) {
    step(1);   // 左滑：下一题
  } else {
    step(-1);  // 右滑：上一题
  }
}, {passive:true});

swipeArea.addEventListener('touchcancel', () => {
  swipeStart = null;
});

/* 键盘快捷键（电脑端） */
document.addEventListener('keydown',e=>{
  if(!$('chapterOverlay').classList.contains('hidden')){
    if(e.key==='Escape')closeChapterModal();
    if(e.key==='Enter'&&e.target?.tagName==='INPUT')saveNewChapter();
    return;
  }
  if(curSheet){if(e.key==='Escape')closeSheet();return}
  if(!run||$('runView').classList.contains('hidden'))return;
  if(['INPUT','TEXTAREA','SELECT'].includes(e.target?.tagName))return;
  if(e.key==='ArrowRight')step(1);
  if(e.key==='ArrowLeft')step(-1);
  if(e.key==='1'||e.key==='t'){const q=run.arr[run.idx];if(currentAnswer(q)===undefined)pick(true)}
  if(e.key==='2'||e.key==='f'){const q=run.arr[run.idx];if(currentAnswer(q)===undefined)pick(false)}
});
boot();
