<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>教育学辨析题库 · 在线版</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#333;line-height:1.6}
.container{max-width:800px;margin:0 auto;padding:20px}
.header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:20px;border-radius:12px;margin-bottom:20px}
.header h1{font-size:1.4rem;margin-bottom:8px}
.header p{opacity:.9;font-size:.9rem}
.chapter-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.chapter-tab{padding:8px 16px;border-radius:20px;border:2px solid #667eea;background:white;color:#667eea;cursor:pointer;font-size:.85rem;transition:all .2s}
.chapter-tab.active{background:#667eea;color:white}
.chapter-tab:hover{transform:translateY(-1px)}
.toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.toolbar button{padding:8px 14px;border:none;border-radius:8px;cursor:pointer;font-size:.85rem;transition:all .2s}
.btn-entry{background:#48bb78;color:white}
.btn-export{background:#ed8936;color:white}
.btn-import{background:#9f7aea;color:white}
.btn-shuffle{background:#4299e1;color:white}
.btn-wrong{background:#f56565;color:white}
.progress-bar{background:#e2e8f0;border-radius:10px;height:8px;margin-bottom:16px;overflow:hidden}
.progress-fill{background:linear-gradient(90deg,#667eea,#764ba2);height:100%;border-radius:10px;transition:width .3s}
.progress-text{font-size:.8rem;color:#666;margin-bottom:20px}
.question-card{background:white;border-radius:12px;padding:24px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.question-number{font-size:.8rem;color:#667eea;font-weight:600;margin-bottom:8px}
.question-text{font-size:1.05rem;font-weight:500;margin-bottom:16px}
.options{display:flex;gap:12px;margin-bottom:16px}
.option-btn{padding:10px 24px;border:2px solid #e2e8f0;border-radius:8px;background:white;cursor:pointer;font-size:.95rem;transition:all .2s}
.option-btn:hover{border-color:#667eea}
.option-btn.correct{border-color:#48bb78;background:#f0fff4}
.option-btn.wrong{border-color:#f56565;background:#fff5f5}
.option-btn:disabled{opacity:.6;cursor:default}
解析-area{background:#f7fafc;border-radius:8px;padding:16px;margin-top:12px;border-left:4px solid #667eea}
解析-area h4{color:#667eea;margin-bottom:8px;font-size:.9rem}
解析-text{font-size:.9rem;color:#555;white-space:pre-wrap}
.edit-btn{position:absolute;bottom:8px;right:8px;background:transparent;border:1px solid #ccc;border-radius:4px;padding:2px 6px;font-size:.75rem;cursor:pointer;opacity:.4;transition:opacity .2s}
.edit-btn:hover{opacity:1}
解析-wrapper{position:relative}
.edit-textarea{width:100%;min-height:120px;padding:8px;border:2px solid #ed8936;border-radius:6px;font-size:.85rem;font-family:inherit;resize:vertical}
.edit-actions{margin-top:8px;display:flex;gap:8px}
.edit-actions button{padding:4px 12px;border:none;border-radius:4px;cursor:pointer;font-size:.8rem}
.edit-save{background:#48bb78;color:white}
.edit-cancel{background:#a0aec0;color:white}
.edited-tag{font-size:.7rem;color:#ed8936;margin-left:8px}
.picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:12px}
.picker-cell{width:40px;height:40px;border-radius:8px;border:2px solid #e2e8f0;background:white;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center}
.picker-cell.correct{border-color:#48bb78;background:#f0fff4;color:#38a169}
.picker-cell.wrong{border-color:#f56565;background:#fff5f5;color:#e53e3e}
.picker-cell.current{border-color:#667eea;background:#667eea;color:white}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal{background:white;border-radius:12px;padding:24px;max-width:600px;width:100%;max-height:80vh;overflow-y:auto}
.modal h3{margin-bottom:16px;color:#667eea}
.modal textarea{width:100%;min-height:150px;padding:12px;border:2px solid #e2e8f0;border-radius:8px;font-size:.9rem;font-family:inherit;resize:vertical}
.modal-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.modal-actions button{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:.85rem}
.btn-primary{background:#667eea;color:white}
.btn-secondary{background:#a0aec0;color:white}
.preview-card{background:#f7fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;margin-bottom:12px}
.preview-card input,.preview-card select,.preview-card textarea{width:100%;padding:6px;border:1px solid #cbd5e0;border-radius:4px;font-size:.85rem;margin-top:4px;margin-bottom:8px}
.login-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;z-index:2000}
.login-box{background:white;border-radius:16px;padding:32px;max-width:400px;width:90%}
.login-box h2{margin-bottom:8px;color:#667eea}
.login-box p{color:#666;margin-bottom:20px;font-size:.9rem}
.login-box input{width:100%;padding:10px 14px;border:2px solid #e2e8f0;border-radius:8px;font-size:1rem;margin-bottom:12px}
.login-box button{width:100%;padding:10px;background:#667eea;color:white;border:none;border-radius:8px;font-size:1rem;cursor:pointer;margin-bottom:8px}
.login-box .switch-mode{background:transparent;color:#667eea;font-size:.85rem}
.login-box .user-info{display:flex;justify-content:space-between;align-items:center;background:#f7fafc;padding:12px;border-radius:8px;margin-bottom:16px}
.login-box .logout-btn{background:#f56565;padding:6px 12px;font-size:.8rem;width:auto}
.completion{text-align:center;padding:40px 20px}
.completion h2{font-size:1.5rem;margin-bottom:12px}
.completion .score{font-size:2.5rem;font-weight:700;color:#667eea;margin-bottom:8px}
.hidden{display:none!important}
@media(max-width:600px){.toolbar{flex-direction:column}.options{flex-direction:column}}
</style>
</head>

<div id="pickerModal" class="modal-overlay hidden" onclick="closePicker(event)"><div class="modal"><h3>📋 选题跳转</h3><div class="picker-grid" id="pickerGrid"></div></div></div>

</div>

<script>
// ============ SUPABASE 配置 ============
const SUPABASE_URL = 'https://zlgnyztvvowvgzxxlwai.supabase.co';
const SUPABASE_KEY = 'sb_publishable_52hHZdToM0YUulRubc3Jzw_L3tPz72h';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ============ 题库数据 ============
let chapters = [
{
id:'edu_ch1', name:'教育学 · 第一章', icon:'📖',
questions:[
{id:'e01',type:'判断',stem:'教育影响是连接教育者与受教育者的中介，只包括教育内容，不包括教育手段。',answer:false,解析:'教育影响包括两大部分：①教育内容（"教什么"）；②教育手段/教育方法（"怎么教"）。题干说"只包括教育内容"，漏掉了教育手段，故错误。\n\n【核心速记】教育影响 = 教育内容 + 教育手段。三要素：教育者（教）、受教育者（学）、教育影响（中介）。'},
{id:'e02',type:'判断',stem:'在教育活动的三个基本要素中，教育内容属于教育影响的重要组成部分。',answer:true,解析:'教育活动的三个基本要素：教育者、受教育者、教育影响。教育影响是连接二者的纽带，包括教育内容和教育手段。教育内容属于教育影响，正确。\n\n【关系图】教育者 → 教育影响（内容+手段）→ 受教育者'},
{id:'e03',type:'判断',stem:'教育活动最基本的矛盾是教育者与受教育者之间的矛盾。',answer:false,解析:'最基本矛盾是受教育者与教育内容之间的矛盾。教育者与受教育者是外在关系；核心冲突在于学习者如何掌握教育内容。题干说"教育者与受教育者"，故错误。\n\n【易错点】别把"最基本矛盾"记成师生关系！'},
{id:'e04',type:'判断',stem:'网课以网络空间和信息技术为媒介展开，属于虚拟教育形态。',answer:true,解析:'按时空存在形态划分：实体教育（面对面物理空间）vs 虚拟教育（以电子技术、信息技术、网络空间为媒介）。网课依托网络，属于虚拟教育，正确。'},
{id:'e05',type:'判断',stem:'教育的历史继承性是指教育会随社会变化而彻底改变，不保留以往特征。',answer:false,解析:'历史继承性强调前后时期相继、继承、保留以往烙印。题干说"彻底改变、不保留"，恰恰是历史性的变化面，不是继承性。故错误。\n\n【区分】历史性=随时代不同而不同；历史继承性=前后延续保留。'},
{id:'e06',type:'判断',stem:'教育促进人的全面和谐发展，体现了教育的正向功能。',answer:true,解析:'按作用方向划分：正向功能=产生积极促进作用（如促进全面发展、推动社会进步）；负向功能=产生消极阻碍。题干"促进"是积极作用，正确。'},
{id:'e07',type:'判断',stem:'显性功能的主要标志是计划性，即结果与教育目的相吻合。',answer:true,解析:'按呈现形式划分：显性功能=有计划、有目的，结果与教育目的吻合，标志是计划性；隐性功能=非计划、潜移默化。题干描述正确。'},
{id:'e08',type:'判断',stem:'某班因过度强调竞争导致学生焦虑厌学，这属于教育的负向功能。',answer:true,解析:'判断正向/负向看结果好坏。过度竞争→焦虑厌学，产生消极阻碍作用，属负向功能。正确。\n\n【技巧】正向/负向看"好坏"，显性/隐性看"是否计划"。'},
{id:'e09',type:'判断',stem:'学校通过隐性课程潜移默化影响学生价值观，这属于显性功能。',answer:false,解析:'"隐性课程""潜移默化"是非计划、潜在的影响，属于隐性功能，不是显性功能。故错误。\n\n【对比】显性=有计划吻合预期；隐性=潜移默化未预料。'},
{id:'e10',type:'判断',stem:'"教育具有自我保存、重复和继承的特点"，体现了教育的超越功能。',answer:false,解析:'保守功能=自我保存、继承、重复、封闭（传递原有文化）；超越功能=创新、突破、引领社会发展。题干描述的是保守功能，不是超越功能。故错误。'},
{id:'e11',type:'判断',stem:'教育的基本要素包括教育者、受教育者和教育手段。',answer:false,解析:'三要素是：教育者、受教育者、教育影响（=教育内容+教育手段）。题干把"教育影响"偷换成了"教育手段"，漏掉了教育内容。故错误。'},
{id:'e12',type:'判断',stem:'虚拟教育是以电子技术、信息技术以及网络空间为媒介的教育形态。',answer:true,解析:'虚拟教育的定义就是如此，与实体教育相对。正确。'},
{id:'e13',type:'判断',stem:'教育的相对独立性意味着教育可以完全脱离社会而存在。',answer:false,解析:'相对独立性≠绝对独立。教育受社会制约（政治、经济），只是不完全同步，有自身规律。不能脱离社会存在。故错误。'},
{id:'e14',type:'判断',stem:'按教育功能的性质划分，教育可分为保守功能和超越功能。',answer:true,解析:'按性质（对社会变化的态度）：保守功能=继承重复；超越功能=创新突破。题干描述正确。'},
{id:'e15',type:'判断',stem:'显性功能和隐性功能一旦被意识到并纳入计划，隐性功能就可以转化为显性功能。',answer:true,解析:'显性/隐性不是绝对的，可以转化。隐性功能被认识并计划化后，就变成显性功能。正确。'},
{id:'e16',type:'判断',stem:'教育的最基本矛盾是受教育者与教育内容之间的矛盾。',answer:true,解析:'贯穿教育活动始终的核心冲突是学习者掌握教育内容的过程，即受教育者与教育内容之间的矛盾。正确。'},
{id:'e17',type:'判断',stem:'教育的保守功能表现为教育具有自我保存、重复和继承的特点。',answer:true,解析:'保守功能的定义就是如此，强调教育的稳定性和延续性。正确。'},
{id:'e18',type:'判断',stem:'教育的历史性强调不同历史时期教育有不同特点，随时代变化而变化。',answer:true,解析:'历史性=不同时期教育不同=随时代变。正确。与历史继承性（保留延续）相对。'},
{id:'e19',type:'判断',stem:'教育者是教育活动的主导，受教育者是学习的主体。',answer:true,解析:'教育者在教育中承担"教"的责任，起主导作用；受教育者承担"学"的责任，是学习主体。正确。'},
{id:'e20',type:'判断',stem:'教育的隐性功能都是负向的。',answer:false,解析:'隐性功能只是"非计划、潜移默化"，可以是正向的（如校风潜移默化培养好习惯），也可以是负向的。故错误。\n\n【易错】隐性≠负向，二者划分标准不同！'},
{id:'e21',type:'判断',stem:'教育影响是连接教育者与受教育者的唯一中介。',answer:true,解析:'教育影响（教育中介系统/教育措施）是连接二者的纽带和中介，包括内容和手段两方面。题干说"唯一中介"在教材语境中即指教育影响，正确。'}
]
},
{id:'edu_psy', name:'教育心理学', icon:'🧠', questions:[]},
{id:'psy', name:'心理学', icon:'🧪', questions:[]},
{id:'bio', name:'生物学', icon:'🧬', questions:[]}
];

// ============ 全局状态 ============
let currentUser = null;
let currentChapterIdx = 0;
let currentQIdx = 0;
let shuffled = false;
let order = [];
let userAnswers = {};   // { qid: true/false }
let wrongSet = {};      // { qid: true }
let edited解析 = {};    // { qid: 'new解析' }
let customQuestions = {}; // { chapterId: [q, ...] }
let authMode = 'login';

// ============ 认证 ============
async function checkAuth(){
const {data:{user}} = await sb.auth.getUser();
if(user){ currentUser = user; showApp(); await loadCloudData(); }
else{ document.getElementById('loginOverlay').classList.remove('hidden'); }
}
async function handleAuth(){
const email = document.getElementById('username').value;
const pwd = document.getElementById('password').value;
if(!email||!pwd){alert('请填写完整');return;}
let res;
if(authMode==='login') res = await sb.auth.signInWithPassword({email,password:pwd});
else res = await sb.auth.signUp({email,password:pwd});
if(res.error){alert(res.error.message);return;}
currentUser = res.data.user;
document.getElementById('loginOverlay').classList.add('hidden');
showApp(); await loadCloudData();
}
function toggleMode(){
authMode = authMode==='login'?'signup':'login';
document.getElementById('loginTitle').textContent = authMode==='login'?'📚 教育学辨析题库':'📝 注册新账号';
document.getElementById('loginDesc').textContent = authMode==='login'?'登录后进度自动云端同步':'注册后开始使用，密码请牢记';
document.getElementById('loginBtn').textContent = authMode==='login'?'登录':'注册';
document.querySelector('.switch-mode').textContent = authMode==='login'?'没有账号？点击注册':'已有账号？点击登录';
}
async function logout(){
await sb.auth.signOut();
location.reload();
}

// ============ 云端数据 ============
async function loadCloudData(){
if(!currentUser)return;
const [{data:p},{data:w},{data:e},{data:c}] = await Promise.all([
sb.from('user_progress').select('*').eq('user_id',currentUser.id),
sb.from('user_wrong').select('*').eq('user_id',currentUser.id),
sb.from('question_edits').select('*').eq('user_id',currentUser.id),
sb.from('custom_questions').select('*').eq('user_id',currentUser.id)
]);
if(p) p.forEach(r=>{ if(r.answers) userAnswers= {...userAnswers, ...r.answers}; });
if(w) w.forEach(r=>{ if(r.wrong_ids) r.wrong_ids.forEach(id=>wrongSet[id]=true); });
if(e) e.forEach(r=>{ if(r.edits) edited解析={...edited解析,...r.edits}; });
if(c) c.forEach(r=>{ if(r.questions) customQuestions[r.chapter_id]=r.questions; });
renderQuestion(); updateProgress();
}
async function saveProgress(){
if(!currentUser)return;
const chapterId = chapters[currentChapterIdx].id;
await sb.from('user_progress').upsert({user_id:currentUser.id,chapter_id:chapterId,answers:userAnswers,updated_at:new Date().toISOString()});
}
async function saveWrong(){
if(!currentUser)return;
const chapterId = chapters[currentChapterIdx].id;
await sb.from('user_wrong').upsert({user_id:currentUser.id,chapter_id:chapterId,wrong_ids:Object.keys(wrongSet),updated_at:new Date().toISOString()});
}
async function saveEdits(){
if(!currentUser)return;
await sb.from('question_edits').upsert({user_id:currentUser.id,edits:edited解析,updated_at:new Date().toISOString()});
}
async function saveCustom(){
if(!currentUser)return;
const chapterId = chapters[currentChapterIdx].id;
await sb.from('custom_questions').upsert({user_id:currentUser.id,chapter_id:chapterId,questions:customQuestions[chapterId]||[],updated_at:new Date().toISOString()});
}

// ============ 主界面 ============
function showApp(){
document.getElementById('mainApp').classList.remove('hidden');
document.getElementById('userEmail').textContent = currentUser.email;
renderTabs();
renderQuestion(); updateProgress();
}
function renderTabs(){
const el=document.getElementById('chapterTabs');
el.innerHTML=chapters.map((c,i)=>`<div class="chapter-tab ${i===currentChapterIdx?'active':''}" onclick="switchChapter(${i})">${c.icon} ${c.name}</div>`).join('');
}
function switchChapter(i){
currentChapterIdx=i; currentQIdx=0; shuffled=false; renderTabs(); renderQuestion(); updateProgress();
}
function getAllQuestions(){
const ch=chapters[currentChapterIdx];
const builtin = ch.questions||[];
const custom = customQuestions[ch.id]||[];
return [...builtin,...custom];
}
function getOrder(){
if(!shuffled){order=getAllQuestions().map((_,i)=>i);return order;}
if(order.length!==getAllQuestions().length) order=getAllQuestions().map((_,i)=>i).sort(()=>Math.random()-.5);
return order;
}
function toggleShuffle(){
shuffled=!shuffled; if(shuffled) order=getAllQuestions().map((_,i)=>i).sort(()=>Math.random()-.5);
else order=getAllQuestions().map((_,i)=>i);
currentQIdx=0; renderQuestion(); updateProgress();
}
function renderQuestion(){
const qs=getAllQuestions(); if(!qs.length){document.getElementById('questionArea').innerHTML='<p style="text-align:center;color:#999;padding:40px">本章暂无题目，点击「📥 录入新题」添加</p>';return;}
const o=getOrder(); if(currentQIdx>=o.length)return showCompletion(qs);
const q=qs[o[currentQIdx]];
const answered = userAnswers[q.id]!==undefined;
const userAns = userAnswers[q.id];
const isCorrect = userAns===q.answer;
const display解析 = edited解析[q.id]||q.解析;
document.getElementById('questionArea').innerHTML=`
<div class="question-card">
<div class="question-number">第 ${currentQIdx+1} / ${o.length} 题 · ${q.type||'判断'} ${q.id&&edited解析[q.id]?'<span class="edited-tag">✎ 已编辑</span>':''}</div>
<div class="question-text">${q.stem}</div>
<div class="options">
<button class="option-btn ${answered?(q.answer===true?'correct':''):''}" id="optT" onclick="answer(${currentQIdx},true)" ${answered?'disabled':''}>✓ 正确</button>
<button class="option-btn ${answered?(q.answer===false?'correct':(userAns===false?'wrong':'')):''}" id="optF" onclick="answer(${currentQIdx},false)" ${answered?'disabled':''}>✗ 错误</button>
</div>
${answered?`<div class="解析-wrapper"><div class="解析-area"><h4>📝 解析</h4><div class="解析-text">${display解析.replace(/\n/g,'<br>')}</div></div><button class="edit-btn" onclick="startEdit('${q.id}')" title="修改解析">✎</button></div>`:''}
<div style="display:flex;justify-content:space-between;margin-top:16px">
<button onclick="prevQ()" ${currentQIdx===0?'disabled':''} style="padding:6px 14px;border:1px solid #ccc;border-radius:6px;background:white;cursor:pointer">← 上一题</button>
<button onclick="openPicker()" style="padding:6px 14px;border:1px solid #667eea;border-radius:6px;background:white;color:#667eea;cursor:pointer">📋 选题</button>
<button onclick="nextQ()" ${currentQIdx>=o.length-1?'disabled':''} style="padding:6px 14px;border:1px solid #ccc;border-radius:6px;background:white;cursor:pointer">下一题 →</button>
</div>
</div>`;
}
function answer(displayIdx,val){
const qs=getAllQuestions(); const o=getOrder(); const q=qs[o[displayIdx]];
userAnswers[q.id]=val;
if(val!==q.answer) wrongSet[q.id]=true; else delete wrongSet[q.id];
renderQuestion(); updateProgress(); saveProgress(); saveWrong();
}
function nextQ(){const o=getOrder();if(currentQIdx<o.length-1){currentQIdx++;renderQuestion();}}
function prevQ(){if(currentQIdx>0){currentQIdx--;renderQuestion();}}
function updateProgress(){
const qs=getAllQuestions(); const total=qs.length; const done=qs.filter(q=>userAnswers[q.id]!==undefined).length;
const pct=total?Math.round(done/total*100):0;
document.getElementById('progressFill').style.width=pct+'%';
document.getElementById('progressText').textContent=`进度：${done}/${total}（${pct}%）`;
}
function showCompletion(qs){
const done=qs.filter(q=>userAnswers[q.id]!==undefined).length;
const correct=qs.filter(q=>userAnswers[q.id]===q.answer).length;
document.getElementById('questionArea').innerHTML='';
document.getElementById('completionPage').classList.remove('hidden');
document.getElementById('scoreDisplay').textContent=`${done}/${qs.length}`;
document.getElementById('completionMsg').textContent=`答对 ${correct} 题，正确率 ${qs.length?Math.round(correct/qs.length*100):0}%`;
}

// ============ 编辑解析 ============
function startEdit(qid){
if(!confirm('确定要修改这道题的解析吗？'))return;
const display解析 = edited解析[qid]||getAllQuestions().find(q=>q.id===qid)?.解析||'';
const el=document.querySelector('.解析-area');
el.innerHTML=`<h4>📝 编辑解析</h4><textarea class="edit-textarea" id="editTa">${display解析}</textarea><div class="edit-actions"><button class="edit-save" onclick="saveEdit('${qid}')">💾 保存</button><button class="edit-cancel" onclick="renderQuestion()">取消</button></div>`;
}
function saveEdit(qid){
const v=document.getElementById('editTa').value.trim();
if(!v){alert('解析不能为空');return;}
edited解析[qid]=v; renderQuestion(); saveEdits();
}

// ============ 选题 ============
function openPicker(){
const o=getOrder(); const qs=getAllQuestions();
const grid=document.getElementById('pickerGrid');
grid.innerHTML=o.map((qi,i)=>{const q=qs[qi];const cls=userAnswers[q.id]===undefined?'':(userAnswers[q.id]===q.answer?'correct':'wrong');const cur=i===currentQIdx?'current':'';return`<div class="picker-cell ${cls} ${cur}" onclick="jumpTo(${i})">${i+1}</div>`;}).join('');
document.getElementById('pickerModal').classList.remove('hidden');
}
function closePicker(e){if(e.target.id==='pickerModal')document.getElementById('pickerModal').classList.add('hidden');}
function jumpTo(i){currentQIdx=i;renderQuestion();document.getElementById('pickerModal').classList.add('hidden');}

// ============ 错题 ============
function showWrong(){
const qs=getAllQuestions(); const wrongQs=qs.filter(q=>wrongSet[q.id]);
if(!wrongQs.length){alert('暂无错题！');return;}
const o=wrongQs.map((_,i)=>i); order=o.map(i=>qs.indexOf(wrongQs[i])); shuffled=true; currentQIdx=0;
renderQuestion(); updateProgress();
}

// ============ 录入 ============
function openEntry(){document.getElementById('entryModal').classList.remove('hidden');}
function closeEntry(e){if(e&&e.target.id!=='entryModal')return;document.getElementById('entryModal').classList.add('hidden');}
function closeEntryBtn(){document.getElementById('entryModal').classList.add('hidden');}
function parseEntry(){
const raw=document.getElementById('entryInput').value.trim(); if(!raw){alert('请粘贴内容');return;}
const blocks=raw.split(/\n\s*\n/); let html='';
blocks.forEach((blk,i)=>{
let stem='',解析='',answer=true,group=chapters[currentChapterIdx].name;
const stemMatch=blk.match(/【题干】(.+?)(?:\n|$)/);
const解析Match=blk.match(/【解析】([\s\S]+)/)||blk.match(/本题考查(.+)/);
if(stemMatch) stem=stemMatch[1].trim();
if(解析Match) 解析=解析Match[0].startsWith('【解析】')?解析Match[0].replace('【解析】','').trim():解析Match[0].trim();
else 解析=blk.replace(/【题干】.+\n?/,'').trim();
const ansMatch=解析.match(/故正确答案为([A-Z])/);
if(ansMatch){answer=ansMatch[1]==='A'||ansMatch[1]==='C'||ansMatch[1]==='T'||ansMatch[1]==='√';}
const考点Match=解析.match(/本题考查([^。，,]+)/);
if(考点Match) group=考点Match[1].trim();
html+=`<div class="preview-card"><input placeholder="题干" value="${stem.replace(/"/g,'&quot;')}"><select>${chapters.map(c=>`<option value="${c.id}" ${c.id===chapters[currentChapterIdx].id?'selected':''}>${c.name}</option>`).join('')}</select><label><input type="radio" name="ans${i}" value="true" ${answer?'checked':''}> 正确</label> <label><input type="radio" name="ans${i}" value="false" ${!answer?'checked':''}> 错误</label><textarea placeholder="解析">${解析}</textarea></div>`;
});
document.getElementById('entryPreview').innerHTML=html+'<div class="modal-actions"><button class="btn-primary" onclick="confirmEntry()">✅ 确认入库</button><button class="btn-secondary" onclick="closeEntryBtn()">取消</button></div>';
}
function confirmEntry(){
const cards=document.querySelectorAll('.preview-card');
cards.forEach((card,i)=>{
const stem=card.querySelector('input[placeholder="题干"]').value.trim();
const chapterId=card.querySelector('select').value;
const answer=card.querySelector(`input[name="ans${i}"]:checked`)?.value==='true';
const解析=card.querySelector('textarea').value.trim();
if(!stem||!解析)return;
if(!customQuestions[chapterId])customQuestions[chapterId]=[];
customQuestions[chapterId].push({id:'c'+Date.now()+i,type:'判断',stem,answer,解析});
});
saveCustom(); closeEntryBtn(); alert('入库成功！');
}

// ============ 导出/导入 ============
function exportData(){
const data={userAnswers,wrongSet,edited解析,customQuestions};
const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='quiz_progress.json';a.click();
}
function importData(e){
const f=e.target.files[0]; if(!f)return;
const r=new FileReader(); r.onload=ev=>{const d=JSON.parse(ev.target.result);Object.assign(userAnswers,d.userAnswers||{});Object.assign(wrongSet,d.wrongSet||{});Object.assign(edited解析,d.edited解析||{});Object.assign(customQuestions,d.customQuestions||{});renderQuestion();updateProgress();alert('导入成功！');};r.readAsText(f);
}
function restartChapter(){userAnswers={};wrongSet={};currentQIdx=0;renderQuestion();updateProgress();}

// ============ 初始化 ============
checkAuth();
</script>
</body>
</html>
